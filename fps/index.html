<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>残照 AFTERGLOW · 实时渲染 FPS</title>
<meta name="description" content="一个运行在浏览器里的小关卡 FPS：程序化 PBR 材质、GTAO、体积光、高度雾与电影级后期。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23120f0d'/%3E%3Ccircle cx='16' cy='18' r='7' fill='%23e9763a'/%3E%3Crect x='4' y='19' width='24' height='9' fill='%23120f0d'/%3E%3C/svg%3E">
<style>
  :root { --hud: rgba(240, 236, 228, 0.92); --dim: rgba(240, 236, 228, 0.5); --accent: #f08a4b; --red: #ff4a36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--hud);
    font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: none; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- loading / menu ---------- */
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 7vh 7vw;
    background: radial-gradient(120% 90% at 70% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.85) 100%); pointer-events: auto; cursor: default; transition: opacity .6s; }
  #overlay.loading { background: #0b0a09; }
  .brand { font-size: clamp(44px, 7vw, 96px); font-weight: 200; letter-spacing: 0.12em; line-height: 1; margin: 0; }
  .brand b { font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
  .sub { margin: 14px 0 0; font-size: 13px; letter-spacing: 0.42em; color: var(--dim); text-transform: uppercase; }
  .tag { margin-top: 26px; max-width: 520px; font-size: 14px; line-height: 1.8; color: rgba(240,236,228,0.72); }
  #bar { margin-top: 40px; width: min(520px, 80vw); height: 2px; background: rgba(255,255,255,0.1); position: relative; overflow: hidden; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); transition: width .2s; }
  #loadlabel { margin-top: 10px; font-size: 11px; letter-spacing: 0.2em; color: var(--dim); font-variant-numeric: tabular-nums; }
  #menu { margin-top: 36px; display: flex; flex-direction: column; gap: 18px; }
  #play { align-self: flex-start; pointer-events: auto; background: none; border: 1px solid rgba(240,236,228,0.5); color: var(--hud);
    padding: 14px 44px; font-size: 15px; letter-spacing: 0.4em; cursor: pointer; transition: all .2s; font-family: inherit; }
  #play:hover { background: var(--accent); border-color: var(--accent); color: #140c07; }
  .opts { display: flex; gap: 28px; flex-wrap: wrap; font-size: 12px; letter-spacing: 0.12em; color: var(--dim); align-items: center; }
  .opts label { display: flex; gap: 10px; align-items: center; }
  .opts select, .opts input { pointer-events: auto; background: rgba(0,0,0,0.4); color: var(--hud); border: 1px solid rgba(255,255,255,0.2); padding: 4px 8px; font-family: inherit; }
  .keys { display: grid; grid-template-columns: repeat(4, auto); gap: 6px 24px; font-size: 12px; color: var(--dim); max-width: 640px; }
  .keys kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 8px; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; font: 11px/18px ui-monospace, monospace; color: var(--hud); text-align: center; }
  #paused { font-size: 12px; letter-spacing: 0.4em; color: var(--accent); }

  /* ---------- HUD ---------- */
  #hud { opacity: 0; transition: opacity .5s; text-shadow: 0 1px 6px rgba(0,0,0,0.55); }
  #hud.on { opacity: 1; }
  #cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: opacity .12s; }
  #cross i { position: absolute; background: var(--hud); box-shadow: 0 0 2px rgba(0,0,0,0.7); }
  #cross .t, #cross .b { width: 2px; height: 9px; left: -1px; }
  #cross .l, #cross .r { height: 2px; width: 9px; top: -1px; }
  #cross .d { width: 2px; height: 2px; left: -1px; top: -1px; }
  #hit { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px; opacity: 0; stroke: #fff; }
  #hit.kill { stroke: var(--red); }
  #dmgdirs { position: absolute; left: 50%; top: 50%; }
  .dd { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    background: conic-gradient(from -18deg, rgba(255,60,40,0.85) 0deg, rgba(255,60,40,0) 36deg, transparent 36deg);
    -webkit-mask: radial-gradient(circle, transparent 78px, #000 80px, #000 88px, transparent 90px); mask: radial-gradient(circle, transparent 78px, #000 80px, #000 88px, transparent 90px); }
  #ammo { position: absolute; right: 56px; bottom: 46px; text-align: right; }
  #ammo .n { font-size: 54px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  #ammo .n small { font-size: 22px; color: var(--dim); margin-left: 6px; }
  #ammo .w { margin-top: 8px; font-size: 11px; letter-spacing: 0.3em; color: var(--dim); }
  #ammo .pips { margin-top: 10px; display: flex; gap: 2px; justify-content: flex-end; }
  #ammo .pips i { width: 3px; height: 10px; background: var(--hud); opacity: 0.85; }
  #ammo .pips i.e { opacity: 0.15; }
  #ammo.low .n { color: var(--red); }
  #health { position: absolute; left: 56px; bottom: 50px; width: 260px; }
  #health .lbl { font-size: 11px; letter-spacing: 0.3em; color: var(--dim); display: flex; justify-content: space-between; }
  #health .bar { margin-top: 8px; height: 4px; background: rgba(255,255,255,0.14); }
  #health .bar i { display: block; height: 100%; width: 100%; background: var(--hud); transition: width .15s; }
  #health.low .bar i { background: var(--red); }
  #compass { position: absolute; left: 50%; top: 18px; width: 520px; height: 34px; margin-left: -260px; overflow: hidden;
    -webkit-mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  #compass .tk { position: absolute; top: 4px; width: 1px; height: 6px; background: var(--dim); }
  #compass .tk.big { height: 10px; background: var(--hud); }
  #compass .lb { position: absolute; top: 15px; font-size: 11px; letter-spacing: 0.1em; transform: translateX(-50%); color: var(--hud); }
  #compass .lb.minor { color: var(--dim); font-size: 10px; }
  #compass .en { position: absolute; top: 2px; width: 8px; height: 8px; margin-left: -4px; background: var(--red); transform: rotate(45deg); box-shadow: 0 0 6px rgba(255,60,40,.8); }
  #compass .en.heavy { width: 11px; height: 11px; margin-left: -5px; top: 1px; }
  #compass .en.kami { background: #ffb020; animation: blink .35s infinite alternate; }
  @keyframes blink { to { opacity: .35; } }
  #compass::after { content: ""; position: absolute; left: 50%; top: 0; width: 0; height: 0; margin-left: -4px; border: 4px solid transparent; border-top-color: var(--accent); }
  #wave { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); text-align: center; font-size: 11px; letter-spacing: 0.4em; color: var(--dim); }
  #wave b { display: block; font-size: 16px; letter-spacing: 0.25em; color: var(--hud); font-weight: 500; margin-top: 6px; }
  #banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; opacity: 0; transition: opacity .6s; }
  #banner .k { font-size: 12px; letter-spacing: 0.6em; color: var(--accent); }
  #banner .t { margin-top: 14px; font-size: 40px; font-weight: 200; letter-spacing: 0.3em; }
  #banner .s { margin-top: 12px; font-size: 13px; letter-spacing: 0.2em; color: var(--dim); }
  #feed { position: absolute; right: 56px; top: 40px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; font-size: 12px; letter-spacing: 0.15em; }
  #feed div { padding: 5px 10px; background: rgba(0,0,0,0.25); border-right: 2px solid var(--accent); animation: feed 3.2s forwards; }
  @keyframes feed { 0% { opacity: 0; transform: translateX(20px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
  #hint { position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); font-size: 12px; letter-spacing: 0.3em; color: var(--hud); opacity: 0; transition: opacity .3s; }
  #fps { position: absolute; left: 12px; top: 10px; font: 11px ui-monospace, monospace; color: var(--dim); }
  #end { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,3,2,0.55); pointer-events: auto; cursor: pointer; }
  #end .t { font-size: 48px; font-weight: 200; letter-spacing: 0.35em; }
  #end .s { margin-top: 20px; font-size: 13px; letter-spacing: 0.2em; color: var(--dim); line-height: 2; text-align: center; }
  #end .c { margin-top: 36px; font-size: 12px; letter-spacing: 0.4em; color: var(--accent); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="layer">
  <div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <svg id="hit" viewBox="0 0 28 28" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 3l6 6M25 3l-6 6M3 25l6-6M25 25l-6-6"/></svg>
  <div id="dmgdirs"></div>
  <div id="compass"></div>
  <div id="wave">第 <span id="wn">1</span> 波<b id="wleft">剩余 0</b></div>
  <div id="scorebox" style="position:absolute;left:56px;top:40px;font-size:11px;letter-spacing:.3em;color:var(--dim)">得分<b id="score" style="display:block;margin-top:6px;font-size:22px;font-weight:300;letter-spacing:.05em;color:var(--hud);font-variant-numeric:tabular-nums">0</b></div>
  <div id="feed"></div>
  <div id="banner"><div class="k" id="bk"></div><div class="t" id="bt"></div><div class="s" id="bs"></div></div>
  <div id="hint"></div>
  <div id="health"><div class="lbl"><span>生命</span><span id="hpn">100</span></div><div class="bar"><i id="hpb"></i></div></div>
  <div id="ammo"><div class="n"><span id="mag">30</span><small>/ <span id="res">180</span></small></div><div class="pips" id="pips"></div><div class="w">MK-18 CQBR · 5.56</div><div class="w">手雷 <span id="gren" style="letter-spacing:0.15em;color:var(--hud)"></span> <kbd style="font-size:10px;border:1px solid rgba(255,255,255,.3);padding:0 4px;border-radius:2px">G</kbd></div></div>
  <div id="fps" class="hidden"></div>
</div>

<div id="overlay" class="loading">
  <h1 class="brand"><b>残照</b> AFTERGLOW</h1>
  <p class="sub">Pier 9 · 黄昏码头 · 实时渲染</p>
  <p class="tag">日落前的最后二十分钟，九号码头被无人机巡逻队接管。清除五波哨兵无人机，夺回堆场。</p>
  <div id="loadwrap"><div id="bar"><i></i></div><div id="loadlabel">初始化渲染器</div></div>
  <div id="menu" class="hidden">
    <div id="paused" class="hidden">已暂停</div>
    <button id="play">开始作战</button>
    <div class="opts">
      <label>时段 <select id="tod"><option value="day">白天</option><option value="golden">黄昏</option><option value="sunset">日落</option></select></label>
      <label>画质 <select id="quality"><option value="low">低</option><option value="medium">中</option><option value="high">高</option><option value="ultra">极致</option></select></label>
      <label>灵敏度 <input id="sens" type="range" min="0.3" max="3" step="0.05" value="1"></label>
      <label>开镜灵敏度 <input id="adssens" type="range" min="0.4" max="1.5" step="0.05" value="0.9"></label>
      <label>视野 <input id="fov" type="range" min="60" max="95" step="1" value="74"></label>
    </div>
    <div class="keys">
      <span><kbd>WASD</kbd>移动</span><span><kbd>鼠标</kbd>瞄准</span><span><kbd>左键</kbd>射击</span><span><kbd>右键</kbd>开镜</span>
      <span><kbd>Shift</kbd>冲刺</span><span><kbd>C</kbd>蹲下</span><span><kbd>空格</kbd>跳跃</span><span><kbd>Q / E</kbd>左右探头</span><span><kbd>R</kbd>换弹</span><span><kbd>G</kbd>手雷</span>
      <span><kbd>F</kbd>帧率</span><span><kbd>P</kbd>照片模式</span><span><kbd>Esc</kbd>暂停</span>
    </div>
  </div>
</div>
<div id="end" class="hidden"><div class="t" id="et"></div><div class="s" id="es"></div><div class="c">点击重新开始</div></div>

void material(vec2 uv, out vec3 albedo, out float h, out float rough, out float metal, out float ao){
  vec2 bc = vec2(4.0, 12.0); // bricks per tile
  vec2 p = uv*bc;
  float row = floor(p.y);
  p.x += mod(row,2.0)*0.5;
  vec2 id = floor(p); vec2 f = fract(p);
  id.x = mod(id.x, bc.x);
  float mx = 0.035, my = 0.10;
  vec2 e = vec2(min(f.x,1.0-f.x)/mx, min(f.y,1.0-f.y)/my);
  float edge = min(e.x, e.y);
  float chip = fbm(uv+hash12(id)*3.0, vec2(48.0), 4);
  float brickMask = smoothstep(0.9, 1.5 + chip*1.4, edge);

  float tone = hash12(id);
  float tone2 = hash12(id+1.3);
  vec3 bcol = mix(vec3(0.42,0.16,0.10), vec3(0.62,0.28,0.17), tone);
  bcol = mix(bcol, vec3(0.30,0.20,0.17), step(0.86, tone2)); // dark clinker
  bcol = mix(bcol, vec3(0.66,0.42,0.30), step(0.93, tone2)*0.7);
  float n = fbm(uv, vec2(32.0), 6);
  float spec = hash12(floor(uv*1024.0));
  bcol *= mix(0.78, 1.12, n);
  bcol *= 0.94 + spec*0.12;

  vec3 mortar = vec3(0.50,0.48,0.44) * mix(0.75,1.05, fbm(uv+4.0, vec2(64.0),4));
  albedo = mix(mortar, bcol, brickMask);
  // soot / grime: vertical streaks from the top
  float streak = fbm(vec2(uv.x, uv.y*0.15), vec2(24.0, 1.0), 5);
  float grime = smoothstep(0.35, 0.9, streak) * 0.55;
  albedo *= 1.0 - grime*0.6;
  // efflorescence (white salt) patches
  float eff = smoothstep(0.66, 0.85, fbm(uv+2.0, vec2(4.0), 5));
  albedo = mix(albedo, vec3(0.70,0.68,0.64), eff*0.35*(1.0-brickMask*0.4));

  h = brickMask*0.7 + n*0.2 + spec*0.04 - (1.0-brickMask)*0.1*fbm(uv, vec2(128.0),3);
  rough = mix(0.95, 0.80, brickMask) - n*0.08;
  metal = 0.0;
  ao = mix(0.55, 1.0, smoothstep(0.0, 1.0, edge*0.6));
}

void material(vec2 uv, out vec3 albedo, out float h, out float rough, out float metal, out float ao){
  // trapezoid profile, 4 per tile in u
  float x = fract(uv.x*4.0);
  // uColorB.x = 1 -> geometry already has the corrugation, keep texture flat
  float prof = mix(smoothstep(0.08, 0.20, x) * (1.0 - smoothstep(0.58, 0.70, x)), 0.6, uColorB.x);
  float n = fbm(uv, vec2(6.0, 4.0), 6);
  float scratches = 0.0;
  {
    vec2 q = vec2(uv.x*40.0 + uv.y*6.0, uv.y*3.0);
    float l = abs(fract(q.x + gnoise(uv*vec2(8.0,4.0), vec2(8.0,4.0))*0.6) - 0.5);
    scratches = (1.0-smoothstep(0.0, 0.015, l)) * step(0.82, vnoise(uv*vec2(16.0,12.0), vec2(16.0,12.0)));
  }
  // dents
  float dent = fbm(uv+8.0, vec2(3.0,2.0), 3);
  // rust: patches + streaks from top rail + bottom
  float rp = smoothstep(0.66, 0.75, fbm(uv+4.4, vec2(6.0,4.0), 6));
  float streak = smoothstep(0.55, 0.95, fbm(vec2(uv.x, uv.y*0.2), vec2(48.0,1.0), 5)) * smoothstep(0.3, 1.0, uv.y);
  float bottom = smoothstep(0.18, 0.0, uv.y) * fbm(uv+1.0, vec2(24.0,4.0), 4)*1.5;
  float rust = sat(rp + streak*0.6 + bottom);
  vec3 paint = uColorA * mix(0.78, 1.06, n);
  paint = mix(paint, paint*1.15 + 0.03, (1.0-prof)*0.15 + smoothstep(0.5,1.0,uv.y)*0.12); // fading
  vec3 rustC = mix(vec3(0.20,0.075,0.03), vec3(0.42,0.18,0.07), fbm(uv+2.0, vec2(48.0,32.0),4));
  albedo = mix(paint, rustC, rust*0.9);
  albedo = mix(albedo, vec3(0.42,0.42,0.40), scratches*0.7);
  // dirt at bottom
  float dirt = smoothstep(0.35, 0.0, uv.y) * 0.5 * fbm(uv+6.0, vec2(16.0,4.0),4);
  albedo = mix(albedo, vec3(0.16,0.13,0.10), dirt);
  albedo *= mix(0.78, 1.0, prof);
  h = prof*0.8 + (dent-0.5)*0.25 + rust*0.03*vnoise(uv*vec2(256.0,128.0), vec2(256.0,128.0)) - scratches*0.02;
  rough = mix(0.5, 0.7, n); rough = mix(rough, 0.92, rust); rough = mix(rough, 0.35, scratches);
  metal = scratches*0.9;
  ao = mix(0.75, 1.0, prof) * (1.0 - smoothstep(0.06, 0.0, uv.y)*0.4);
}

  float seam = 1.0 - smoothstep(0.0, 0.004, min(min(f.x,1.0-f.x), min(f.y,1.0-f.y)));

  vec2 tp = fract(p*vec2(2.0,3.0)) - 0.5;
  float hole = 1.0 - smoothstep(0.018, 0.026, length(tp*vec2(1.0, 1.5)));
  float holeRim = smoothstep(0.02, 0.03, length(tp*vec2(1.0,1.5))) * (1.0 - smoothstep(0.03, 0.06, length(tp*vec2(1.0,1.5))));
  float panelTone = hash12(id+2.0);
  float n = fbm(uv, vec2(8.0), 7);
  float wood = gnoise(vec2(uv.x*6.0, uv.y*160.0) + fbm(uv, vec2(4.0), 3)*3.0, vec2(6.0, 160.0))*0.5+0.5;

  float streak = smoothstep(0.4, 0.95, fbm(vec2(uv.x, uv.y*0.1), vec2(40.0, 1.0), 6));

  c = mix(c, vec3(0.20,0.22,0.17), bottomDamp*0.7); // moss/damp

void material(vec2 uv, out vec3 albedo, out float h, out float rough, out float metal, out float ao){
  float planks = 6.0;
  float py = uv.y*planks; float pid = floor(py); float pf = fract(py);
  float seam = 1.0 - smoothstep(0.0, 0.025, min(pf, 1.0-pf));
  float off = hash12(vec2(pid, 1.0));
  vec2 g = vec2(uv.x + off, uv.y);
  float warp = fbm(g, vec2(2.0, 12.0), 4);
  float grain = sin((g.y*planks*14.0 + warp*12.0 + gnoise(g*vec2(4.0,96.0), vec2(4.0,96.0))*1.5)*PI)*0.5+0.5;
  float fine = gnoise(g*vec2(8.0, 512.0), vec2(8.0,512.0))*0.5+0.5;
  // knots
  vec3 kv = voronoi(g, vec2(3.0, 18.0));
  float knot = (1.0 - smoothstep(0.05, 0.15, kv.x)) * step(0.75, kv.z);
  float tone = hash12(vec2(pid, 7.0));
  vec3 c = mix(vec3(0.42,0.30,0.18), vec3(0.62,0.48,0.32), tone);
  c = mix(c*0.75, c, grain);
  c *= 0.9 + fine*0.15;
  c = mix(c, vec3(0.22,0.14,0.08), knot);
  // greying weathering
  float weather = fbm(uv+1.0, vec2(4.0), 5);
  c = mix(c, vec3(0.42,0.40,0.37)*(0.8+grain*0.3), smoothstep(0.35, 0.8, weather)*0.7);
  c = mix(c, vec3(0.05), seam);
  albedo = c;
  h = grain*0.25 + fine*0.15 - seam*0.9 - knot*0.15;
  rough = mix(0.78, 0.95, fine);
  metal = 0.0;
  ao = 1.0 - seam*0.7;
}
