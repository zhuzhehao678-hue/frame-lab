<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171817">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%274%27 fill=%27%23171817%27/%3E%3Cpath d=%27M8 25V7h16v18H8m5-4V11h7v10h-7%27 fill=%27none%27 stroke=%27%23ed6547%27 stroke-width=%272%27/%3E%3C/svg%3E">
<title>FRAME 形场 · 粒子动画</title>
<style>
  :root { --bg: #171817; --fg: #e8e4dc; --accent: #ed6547; --muted: #8a8a84; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .hud { position: fixed; left: 0; right: 0; padding: 24px 28px; display: flex; justify-content: space-between;
    align-items: center; pointer-events: none; font-size: 13px; letter-spacing: .08em; }
  .hud.top { top: 0; }
  .hud.bottom { bottom: 0; color: var(--muted); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .2em; }
  .brand svg { width: 22px; height: 22px; }
  .stage { font-variant-numeric: tabular-nums; color: var(--muted); }
  .stage b { color: var(--accent); font-weight: 500; }
  .controls { display: flex; gap: 8px; pointer-events: auto; }
  button { background: transparent; color: var(--fg); border: 1px solid #3a3b39; border-radius: 999px;
    padding: 7px 14px; font: inherit; letter-spacing: .06em; cursor: pointer; transition: border-color .2s, color .2s; }
  button:hover, button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  .progress { position: fixed; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; opacity: .7; }
</style>
</head>
<body>
<canvas id="c" aria-label="FRAME 形场粒子动画"></canvas>

<div class="hud top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 25V7h16v18H8m5-4V11h7v10h-7" fill="none" stroke="#ed6547" stroke-width="2"/></svg>
    FRAME 形场
  </div>
  <div class="stage" id="stage">01 / 04 · <b>流场</b></div>
</div>

<div class="hud bottom">
  <span>移动鼠标扰动粒子 · 点击画面切换下一幕 · 空格暂停</span>
  <div class="controls">
    <button id="pause" type="button">暂停</button>
    <button id="next" type="button">下一幕</button>
  </div>
</div>
<div class="progress" id="progress"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stageEl = document.getElementById('stage');
  const progressEl = document.getElementById('progress');
  const pauseBtn = document.getElementById('pause');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const BG = [23, 24, 23];
  const ACCENT = [237, 101, 71];
  const LIGHT = [232, 228, 220];

  const SCENES = [
    { name: '流场', kind: 'flow', duration: 4.5 },
    { name: '形', kind: 'logo', duration: 5.5 },
    { name: 'FRAME', kind: 'text', text: 'FRAME', duration: 5.5 },
    { name: '形场', kind: 'text', text: '形场', duration: 5.5 },
  ];

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let sceneIndex = 0, sceneTime = 0, paused = false;
  let last = performance.now(), clock = 0;
  const mouse = { x: -1e4, y: -1e4, active: false };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = `rgb(${BG})`;
    ctx.fillRect(0, 0, W, H);
    const count = Math.round(Math.min(3200, Math.max(900, W * H / 420)));
    if (particles.length !== count) {
      particles = Array.from({ length: count }, (_, i) => makeParticle(i));
    }
    applyScene(false);
  }

  function makeParticle(i) {
    const accent = Math.random() < 0.28;
    return {
      x: Math.random() * W, y: Math.random() * H,
      vx: 0, vy: 0, tx: 0, ty: 0, hasTarget: false,
      size: accent ? 1.6 + Math.random() * 1.2 : 0.8 + Math.random() * 1.1,
      color: accent ? ACCENT : LIGHT,
      seed: Math.random() * 1000,
      delay: Math.random() * 0.9,
    };
  }

  function sampleTargets(scene) {
    const off = document.createElement('canvas');
    const scale = 0.5;
    off.width = Math.ceil(W * scale); off.height = Math.ceil(H * scale);
    const o = off.getContext('2d');
    const cw = off.width, ch = off.height;
    o.fillStyle = '#fff'; o.strokeStyle = '#fff';

    if (scene.kind === 'logo') {
      const s = Math.min(cw, ch) * 0.6 / 18;
      const ox = cw / 2 - 16 * s, oy = ch / 2 - 16 * s;
      o.lineWidth = Math.max(2, s * 1.6);
      o.lineJoin = 'miter';
      o.beginPath();
      o.moveTo(ox + 8 * s, oy + 25 * s);
      o.lineTo(ox + 8 * s, oy + 7 * s);
      o.lineTo(ox + 24 * s, oy + 7 * s);
      o.lineTo(ox + 24 * s, oy + 25 * s);
      o.closePath();
      o.moveTo(ox + 13 * s, oy + 21 * s);
      o.lineTo(ox + 13 * s, oy + 11 * s);
      o.lineTo(ox + 20 * s, oy + 11 * s);
      o.lineTo(ox + 20 * s, oy + 21 * s);
      o.closePath();
      o.stroke();
    } else {
      const isCJK = /[^\x00-\x7f]/.test(scene.text);
      let size = Math.min(ch * 0.42, cw / (scene.text.length * (isCJK ? 1.05 : 0.68)));
      o.font = `${isCJK ? 700 : 800} ${size}px -apple-system, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif`;
      o.textAlign = 'center'; o.textBaseline = 'middle';
      o.fillText(scene.text, cw / 2, ch / 2 + size * 0.04);
    }

    const data = o.getImageData(0, 0, cw, ch).data;
    const pts = [];
    const gap = Math.max(2, Math.round(Math.sqrt(cw * ch / particles.length) * 0.32));
    for (let y = 0; y < ch; y += gap) {
      for (let x = 0; x < cw; x += gap) {
        if (data[(y * cw + x) * 4 + 3] > 128) pts.push([x / scale, y / scale]);
      }
    }
    for (let i = pts.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [pts[i], pts[j]] = [pts[j], pts[i]];
    }
    return pts;
  }

  function applyScene(burst = true) {
    const scene = SCENES[sceneIndex];
    stageEl.innerHTML = `${String(sceneIndex + 1).padStart(2, '0')} / ${String(SCENES.length).padStart(2, '0')} · <b>${scene.name}</b>`;
    if (scene.kind === 'flow') {
      particles.forEach(p => { p.hasTarget = false; });
      if (burst) {
        particles.forEach(p => {
          const a = Math.random() * Math.PI * 2, f = 2 + Math.random() * 6;
          p.vx += Math.cos(a) * f; p.vy += Math.sin(a) * f;
        });
      }
      return;
    }
    const pts = sampleTargets(scene);
    if (!pts.length) return;
    // Particles beyond the sampled point count drift as ambient dust instead of stacking on the shape.
    const used = Math.min(particles.length, Math.max(pts.length, Math.floor(particles.length * 0.82)));
    particles.forEach((p, i) => {
      if (i < used) {
        const [tx, ty] = pts[i % pts.length];
        p.tx = tx + (Math.random() - 0.5) * 1.5;
        p.ty = ty + (Math.random() - 0.5) * 1.5;
        p.hasTarget = true;
      } else {
        p.hasTarget = false;
      }
    });
  }

  function nextScene() {
    sceneIndex = (sceneIndex + 1) % SCENES.length;
    sceneTime = 0;
    applyScene(true);
  }

  function flowAngle(x, y, t) {
    const s = 0.0028;
    return Math.sin(x * s + t * 0.25) * 1.6
         + Math.cos(y * s * 1.3 - t * 0.2) * 1.4
         + Math.sin((x + y) * s * 0.6 + t * 0.1) * 1.2;
  }

  function step(dt) {
    clock += dt;
    sceneTime += dt;
    const scene = SCENES[sceneIndex];
    if (sceneTime >= scene.duration) nextScene();
    progressEl.style.width = `${Math.min(1, sceneTime / scene.duration) * 100}%`;

    const k = dt * 60;
    const speedMul = reduceMotion ? 0.4 : 1;

    ctx.fillStyle = `rgba(${BG}, ${reduceMotion ? 0.35 : 0.2})`;
    ctx.fillRect(0, 0, W, H);

    for (const p of particles) {
      if (p.hasTarget && sceneTime > p.delay) {
        const dx = p.tx - p.x, dy = p.ty - p.y;
        const ramp = Math.min(1, (sceneTime - p.delay) / 1.2);
        const pull = 0.012 + 0.05 * ramp * ramp;
        p.vx += dx * pull * k * speedMul;
        p.vy += dy * pull * k * speedMul;
        p.vx *= Math.pow(0.82, k);
        p.vy *= Math.pow(0.82, k);
        const shimmer = 0.15;
        p.vx += Math.cos(clock * 2 + p.seed) * shimmer;
        p.vy += Math.sin(clock * 2.3 + p.seed) * shimmer;
      } else {
        const a = flowAngle(p.x, p.y, clock);
        p.vx += Math.cos(a) * 0.12 * k * speedMul;
        p.vy += Math.sin(a) * 0.12 * k * speedMul;
        p.vx *= Math.pow(0.965, k);
        p.vy *= Math.pow(0.965, k);
      }

      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy, R = 110;
        if (d2 < R * R && d2 > 0.01) {
          const d = Math.sqrt(d2), f = (1 - d / R) * 3.2 * k;
          p.vx += dx / d * f; p.vy += dy / d * f;
        }
      }

      p.x += p.vx * k; p.y += p.vy * k;

      if (!p.hasTarget) {
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      }

      const speed = Math.hypot(p.vx, p.vy);
      const alpha = Math.min(1, 0.45 + speed * 0.12);
      ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
      const r = p.size * (1 + Math.min(speed, 6) * 0.06);
      ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
    }
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) step(dt);
    requestAnimationFrame(loop);
  }

  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? '播放' : '暂停';
  }

  addEventListener('resize', resize);
  canvas.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  canvas.addEventListener('pointerleave', () => { mouse.active = false; });
  canvas.addEventListener('click', nextScene);
  document.getElementById('next').addEventListener('click', nextScene);
  pauseBtn.addEventListener('click', togglePause);
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    if (e.code === 'ArrowRight') nextScene();
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
